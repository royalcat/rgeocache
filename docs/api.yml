openapi: "3.0.2"
info:
  title: RGeoCoderApi
  version: "1.0"

# x-tagGroups:
#   - name: Reverse Geocoding
#     tags:
#       - reverse
#   - name: Forward Geocoding
#     tags:
#       - forward

paths:
  /rgeocode/address/{lat}/{lon}:
    parameters:
      - name: lat
        in: path
        required: true
        schema:
          type: string
      - name: lon
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get address by coordinates
      tags:
        - reverse
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
        "500":
          description: Server error
        "400":
          description: Bad request
        "204":
          description: Nothing found in location

  /rgeocode/multiaddress:
    get:
      summary: Get multiple addresses with single request
      tags:
        - reverse
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: array
                maxItems: 2
                minItems: 2
                description: "[lat, lon]"
                items:
                  type: number
                  format: float64

      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Address"
        "500":
          description: Server error
        "400":
          description: Bad request
    post:
      summary: Get multiple addresses with single request
      tags:
        - reverse
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: array
                maxItems: 2
                minItems: 2
                description: "[lat, lon]"
                items:
                  type: number
                  format: float64

      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Address"
        "500":
          description: Server error
        "400":
          description: Bad request

  /rgeocode/points:
    parameters:
      - name: lat
        in: query
        required: true
        description: Latitude of the query center, in degrees.
        schema:
          type: number
          format: float64
          minimum: -90
          maximum: 90
      - name: lon
        in: query
        required: true
        description: Longitude of the query center, in degrees.
        schema:
          type: number
          format: float64
          minimum: -180
          maximum: 180
      - name: radius
        in: query
        required: false
        description: |
          Search radius in degrees around the center. Must be positive; values
          above 1 are clamped to 1. Defaults to 0.01, the default
          `--search-radius`.
        schema:
          type: number
          format: float64
          default: 0.01
      - name: limit
        in: query
        required: false
        description: |
          Maximum number of points returned, nearest first. Clamped to
          1-50000; `truncated` reports when more points matched.
        schema:
          type: integer
          minimum: 1
          maximum: 50000
          default: 10000
      - name: kind
        in: query
        required: false
        description: |
          Comma-separated object kinds to include: `building`, `road`, `area`
          (aliases `b`/`r`/`a`). Unknown values are ignored; absent or empty
          means all kinds. A cached point is never a zone.
        schema:
          type: string
          example: "building,road"
    get:
      summary: Get cached points within a radius of a location
      tags:
        - reverse
      responses:
        "200":
          description: |
            OK. A GeoJSON FeatureCollection with `truncated` and `total`
            foreign members: one Point feature per cached point, nearest
            first. Properties carry the point's address, its `weight` and its
            `geo_type`. `region` and `country` are filled from the zone
            borders when the stored record lacks them.
          content:
            application/json:
              schema:
                type: object
                required: [type, features, truncated, total]
                properties:
                  type:
                    type: string
                    enum: [FeatureCollection]
                  truncated:
                    type: boolean
                    description: True when more points matched than the limit allowed.
                  total:
                    type: integer
                    description: Total number of matching points, before the limit.
                  features:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [Feature]
                        geometry:
                          type: object
                          properties:
                            type:
                              type: string
                              enum: [Point]
                            coordinates:
                              type: array
                              description: "[lon, lat]"
                              items:
                                type: number
                                format: float64
                        properties:
                          allOf:
                            - $ref: "#/components/schemas/Address"
                            - type: object
                              properties:
                                weight:
                                  type: integer
                                geo_type:
                                  type: string
                                  enum: [building, road, area]
        "400":
          description: |
            Bad request: missing or out-of-range `lat`/`lon`, or a
            non-positive or malformed `radius`.
        "500":
          description: Server error

  /fgeocode/search:
    parameters:
      - name: q
        in: query
        required: false
        description: |
          Free-text query for an address. Tokens are all required to match.
          Maximum 256 characters. Optional when a structured field is given.
        schema:
          type: string
          maxLength: 256
      - name: city
        in: query
        required: false
        description: Structured city filter, matched against the city field only.
        schema:
          type: string
          maxLength: 256
      - name: region
        in: query
        required: false
        description: Structured region filter, matched against the region field only.
        schema:
          type: string
          maxLength: 256
      - name: street
        in: query
        required: false
        description: Structured street filter, matched against the street field only.
        schema:
          type: string
          maxLength: 256
      - name: house
        in: query
        required: false
        description: |
          Structured house-number filter. Type-word aliases are normalized
          ("12 корпус 1" and "12к1" are equivalent).
        schema:
          type: string
          maxLength: 256
      - name: name
        in: query
        required: false
        description: Structured object-name filter.
        schema:
          type: string
          maxLength: 256
      - name: kind
        in: query
        required: false
        description: |
          Comma-separated object kinds to include. Accepts `zone`, `building`,
          `road` and `area` (aliases `z`, `b`, `r`, `a`). Unknown values are
          ignored. Defaults to all kinds.
        schema:
          type: string
          example: zone,road
      - name: limit
        in: query
        required: false
        description: Maximum number of results. Clamped to 1-100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - name: offset
        in: query
        required: false
        description: Number of results to skip. Pagination is shallow.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: include_polygon
        in: query
        required: false
        description: Include the full multipolygon for zone hits.
        schema:
          type: boolean
          default: true
    get:
      summary: Get coordinates of found address or zone for a query
      tags:
        - forward
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required:
                        - address_string
                        - point
                        - score
                        - geo_type
                      properties:
                        address_string:
                          type: string
                          description: Matched address, empty parts omitted
                        score:
                          type: number
                          description: Score of the match
                          format: float32
                        point:
                          description: |
                            Center of the found object, as [latitude, longitude].
                          type: array
                          items:
                            type: number
                            format: float
                          minItems: 2
                          maxItems: 2
                          example: [55.75, 37.61]
                        geo_type:
                          type: string
                          description: Kind of the matched object
                          enum: [zone, building, road, area]
                        country:
                          type: string
                          description: Country containing the point; empty for zones
                        multipolygon:
                          type: array
                          description: GeoJSON Multipolygon, only for zones
        "400":
          description: |
            Bad request (no `q` and no structured field, a value longer than
            256 characters, or an invalid numeric parameter)
        "500":
          description: Server error
        "503":
          description: Forward geocoder index is still building or failed to build

  /fgeocode/autocomplete:
    parameters:
      - name: q
        in: query
        required: true
        description: Prefix to complete. Maximum 256 characters.
        schema:
          type: string
          maxLength: 256
      - name: limit
        in: query
        required: false
        description: Maximum number of suggestions. Clamped to 1-100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
    get:
      summary: Suggest address terms for a prefix
      tags:
        - forward
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      type: object
                      required:
                        - text
                        - doc_freq
                      properties:
                        text:
                          type: string
                        doc_freq:
                          type: integer
                          description: Number of indexed documents containing the term
        "400":
          description: Bad request (missing `q` or `q` longer than 256 characters)
        "500":
          description: Server error
        "503":
          description: Forward geocoder index is still building or failed to build

  /roadgraph/box:
    parameters:
      - name: bbox
        in: query
        required: true
        description: |
          Bounding box as `min_lon,min_lat,max_lon,max_lat` (GeoJSON axis
          order). Edges are returned whole when their segment intersects it.
        schema:
          type: string
          example: "-0.13,51.50,-0.12,51.51"
      - name: directions
        in: query
        required: false
        description: |
          Include per-edge direction metadata (`both`, `forward`, `backward`)
          as the `direction` property. Defaults to true; pass
          `directions=false` to omit the property.
        schema:
          type: boolean
          default: true
      - name: simplify
        in: query
        required: false
        description: |
          Merge connected edges that share their `street`/`name`/`class`/
          `direction` into one LineString and drop vertices that lie within
          1e-7 degrees (about one centimetre, latitude-weighted) of the
          straight chord. Chains break at junctions (nodes of degree != 2) and
          at property changes, so junction points are always kept, and Point
          features are exactly the vertices kept in the simplified lines.
          Defaults to true; `simplify=false` returns one two-point LineString
          per raw edge with every endpoint as a Point.
        schema:
          type: boolean
          default: true
      - name: limit
        in: query
        required: false
        description: |
          Maximum number of raw graph edges considered. Clamped to 1-50000.
          Merging happens after this limit, so an optimized response can
          contain fewer features than `limit`.
        schema:
          type: integer
          minimum: 1
          maximum: 50000
          default: 10000
    get:
      summary: Get road graph edges and nodes inside a bounding box
      tags:
        - roadgraph
      responses:
        "200":
          description: |
            OK. A GeoJSON FeatureCollection with a `truncated` foreign member:
            LineString features (one merged, simplified polyline per chain by
            default; one two-point segment per raw edge with
            `simplify=false`) and one Point feature per kept vertex.
          content:
            application/json:
              schema:
                type: object
                required: [type, features]
                properties:
                  type:
                    type: string
                    enum: [FeatureCollection]
                  truncated:
                    type: boolean
                    description: True when more edges matched than the limit allowed.
                  features:
                    type: array
                    items:
                      type: object
                      description: |
                        Edge feature: geometry LineString with properties `from`,
                        `to` (the chain endpoints when simplified), optional
                        `name` and `street`, `class`, and `direction` unless
                        `directions=false`. Node feature: geometry Point with
                        property `id` referencing a stable point position.
              example:
                type: FeatureCollection
                truncated: false
                features:
                  - type: Feature
                    geometry:
                      type: LineString
                      coordinates:
                        - [-0.12760, 51.50735]
                        - [-0.12700, 51.50700]
                    properties:
                      from: 123456
                      to: 789012
                      street: Oxford Street
                      class: primary
                      direction: forward
                  - type: Feature
                    geometry:
                      type: Point
                      coordinates: [-0.12760, 51.50735]
                    properties:
                      id: 123456
        "400":
          description: Bad request (malformed or out-of-range `bbox`)
        "500":
          description: Server error
        "503":
          description: The cache has no road graph section (generated before the feature)

components:
  schemas:
    Address:
      type: object
      properties:
        name:
          type: string
        street:
          type: string
        house_number:
          type: string
        city:
          type: string
        region:
          type: string
        country:
          type: string
